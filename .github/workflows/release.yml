name: release

# Push a bare x.y.z tag (made by `npm version x.y.z`) and this builds the
# plugin and publishes a GitHub release with the three files Obsidian installs.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps  # obsidian pins an older @codemirror/state peer
      - name: Tag matches manifest.json and versions.json
        run: |
          tag="${GITHUB_REF_NAME}"
          node -e '
            const tag = process.argv[1];
            const m = require("./manifest.json"), v = require("./versions.json");
            if (m.version !== tag) throw new Error(`manifest.json version ${m.version} != tag ${tag}`);
            if (v[tag] !== m.minAppVersion) throw new Error(`versions.json has no ${tag}: ${m.minAppVersion}`);
          ' "$tag"
      - run: npm run lint
      - run: npm run check
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes

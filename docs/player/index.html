<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The embed needs a real https referrer; Obsidian iOS (capacitor://localhost) gives it none. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YT Free player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #player { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>
<script>
/*
 * YT Free (GitHub #25): YouTube's own IFrame player, hosted on an https page so
 * Obsidian on the iPhone can frame it. It reports to the plugin that framed it
 * and takes play, pause, seek and speed from it. Nothing is stored or sent
 * anywhere else.
 *
 *   ?v=<videoId>&t=<seconds>&rate=<speed>&play=0   (play=0: start, then hold paused)
 */
(function () {
  "use strict";
  var params = new URLSearchParams(location.search);
  var id = params.get("v") || "";
  var start = Math.max(0, Math.floor(Number(params.get("t")) || 0));
  var rate = Number(params.get("rate")) || 1;
  var autoplay = params.get("play") !== "0";
  var SOURCE = "ytfree-player";
  var player = null;

  function send(type, data) {
    if (window.parent === window) return;
    var msg = { source: SOURCE, type: type };
    for (var k in data) msg[k] = data[k];
    window.parent.postMessage(msg, "*");
  }

  if (!/^[A-Za-z0-9_-]{11}$/.test(id)) {
    send("error", { code: "bad-id" });
    document.body.textContent = "No video.";
    return;
  }

  function status() {
    if (!player || !player.getCurrentTime) return;
    send("status", {
      time: player.getCurrentTime() || 0,
      duration: player.getDuration() || 0,
      state: player.getPlayerState(),
      rate: player.getPlaybackRate ? player.getPlaybackRate() : 1,
      quality: player.getPlaybackQuality ? player.getPlaybackQuality() : "",
    });
  }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player("player", {
      videoId: id,
      width: "100%",
      height: "100%",
      playerVars: { playsinline: 1, start: start, rel: 0, autoplay: 1, mute: hold ? 1 : 0 },
      events: {
        onReady: function () {
          if (rate !== 1) player.setPlaybackRate(rate);
          send("ready", {});
          status();
          setInterval(status, 1000);
          startScripted();
        },
        onStateChange: function (e) { onState(e); status(); },
        onPlaybackQualityChange: status,
        onPlaybackRateChange: status,
        onError: function (e) { send("error", { code: e.data }); },
      },
    });
  };

  /*
   * Every start is scripted, never a tap on YouTube's own play button
   * (Isaiah, 2026-11-10: the reader shouldn't have to tap it, and a scripted
   * start is the player as he uses it today).
   *
   * - play=0 (the reader was paused): start muted, and on the first frame
   *   pause, go back to the start second and unmute. A later tap on YouTube's
   *   play only resumes it.
   * - Otherwise: start with sound. If iOS refuses that (still not playing after
   *   1.5 s), start muted, then unmute once it plays. Whether iOS lets the
   *   unmute stand is what the iPhone test finds out; each step is logged.
   */
  var hold = !autoplay;
  var mutedStart = false;
  function startScripted() {
    if (hold) { player.mute(); player.playVideo(); log("start muted to hold paused", {}); return; }
    player.playVideo();
    setTimeout(function () {
      var st = player.getPlayerState();
      if (st === 1 || st === 3) return;
      log("sound autoplay refused", { state: st });
      mutedStart = true;
      player.mute();
      player.playVideo();
    }, 1500);
  }
  function afterFirstFrame() {
    if (hold) {
      hold = false;
      player.pauseVideo();
      player.seekTo(start, true);
      player.unMute();
      log("held paused at start", {});
      return true;
    }
    if (mutedStart) {
      mutedStart = false;
      player.unMute();
      log("unmuted after muted start", {});
      later("state after unmute", 500);
      later("state after unmute", 2000);
    }
    return false;
  }

  /*
   * Keep playing when the app goes to the background or the phone locks
   * (GitHub #25). iOS pauses media as the page is hidden; a pause that lands
   * within 3 seconds of that, while it was playing, is the system's and not the
   * reader's, so it is undone. Every step is reported to the plugin as a "log"
   * message, so a test on the iPhone shows what iOS and YouTube actually did.
   */
  var playing = false;
  var hiddenAt = 0;
  var t0 = Date.now();
  function log(event, extra) {
    var d = { event: event, ms: Date.now() - t0, vis: document.visibilityState };
    if (player && player.getPlayerState) d.state = player.getPlayerState();
    for (var k in extra) d[k] = extra[k];
    send("log", d);
  }
  function later(label, ms) {
    setTimeout(function () { log(label, { after: ms }); }, ms);
  }
  document.addEventListener("visibilitychange", function () {
    var hidden = document.visibilityState === "hidden";
    if (hidden) hiddenAt = Date.now();
    log(hidden ? "page hidden" : "page visible", { playing: playing });
    if (hidden) { later("state after hide", 500); later("state after hide", 3000); }
  });
  window.addEventListener("pagehide", function () { log("pagehide", {}); });
  window.addEventListener("freeze", function () { log("freeze", {}); });
  window.addEventListener("blur", function () { log("blur", {}); });
  function onState(e) {
    var s = e.data;
    var sinceHide = hiddenAt ? Date.now() - hiddenAt : -1;
    log("youtube state", { to: s, sinceHide: sinceHide });
    if (s === 1) {
      if (afterFirstFrame()) return;
      playing = true;
      return;
    }
    if (s === 2 && playing && document.visibilityState === "hidden" && sinceHide < 3000) {
      log("resuming a system pause", {});
      setTimeout(function () {
        try { player.playVideo(); log("playVideo called", {}); }
        catch (err) { log("playVideo threw", { error: String(err) }); }
        later("state after resume", 500);
        later("state after resume", 2000);
      }, 0);
      return;
    }
    if (s === 2 || s === 0) playing = false;
  }

  window.addEventListener("message", function (e) {
    if (e.source !== window.parent || !player || !player.seekTo) return;
    var d = e.data;
    if (!d || d.source !== "ytfree") return;
    if (d.cmd === "play") player.playVideo();
    else if (d.cmd === "pause") player.pauseVideo();
    else if (d.cmd === "seek" && typeof d.time === "number") player.seekTo(d.time, true);
    else if (d.cmd === "rate" && typeof d.rate === "number") player.setPlaybackRate(d.rate);
    else if (d.cmd === "status") status();
  });

  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
})();
</script>
</body>
</html>
